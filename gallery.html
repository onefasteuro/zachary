<style>
  :root {
    --black:      #080808;
    --black-mid:  #111111;
    --black-card: #1a1a1a;
    --black-soft: #222222;
    --gold:       #D4A017;
    --gold-light: #FFE066;
    --gold-dim:   #8B6000;
    --green:      #3a9a4a;
    --green-light:#5abf6a;
    --green-pale: #0d1f0f;
    --white:      #ffffff;
    --muted:      rgba(255,255,255,0.55);
    --body-text:  rgba(255,255,255,0.85);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--black);
    font-family: 'Nunito', sans-serif;
    color: var(--body-text);
    overflow-x: hidden;
  }

  /* ── SHINE BAR ── */
  .shine-bar {
    height: 6px;
    background: linear-gradient(90deg,
      var(--gold-dim) 0%, var(--gold) 15%,
      var(--gold-light) 50%, var(--gold) 85%,
      var(--gold-dim) 100%);
  }

  /* ── HERO ── */
  .hero {
    min-height: 60vh;
    background: linear-gradient(160deg, #0a0a0a 0%, #1a0d30 50%, #0a0a0a 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 60px 24px 40px;
    text-align: center;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: '🦁';
    position: absolute;
    font-size: 500px; opacity: 0.03;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, rgba(212,160,23,0.08) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }
  .hero-content { position: relative; z-index: 1; max-width: 700px; }
  .hero-eyebrow {
    font-family: 'Caveat', cursive;
    font-size: 1.2rem; color: var(--muted);
    letter-spacing: 3px; margin-bottom: 8px;
  }
  .hero h1 {
    font-family: 'Bangers', cursive;
    font-size: clamp(4rem, 15vw, 8rem);
    font-weight: 900; letter-spacing: 8px; line-height: 1;
    background: linear-gradient(135deg, var(--gold-dim) 0%, var(--gold) 25%, var(--gold-light) 50%, var(--gold) 75%, var(--gold-dim) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 4px 20px rgba(212,160,23,0.3));
    margin-bottom: 10px;
  }
  .hero-subtitle {
    font-family: 'Bangers', cursive;
    font-size: clamp(1.1rem, 4vw, 1.6rem);
    color: var(--gold-light);
    letter-spacing: 3px; margin-bottom: 16px;
  }
  .hero-backlink {
    display: inline-block;
    margin-top: 18px;
    font-family: 'Caveat', cursive;
    font-size: 1.15rem;
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid rgba(212,160,23,0.4);
    transition: color 0.2s;
  }
  .hero-backlink:hover { color: var(--gold-light); }

  /* ── GALLERY MASONRY ── */
  .gallery {
    padding: 40px 20px 60px;
    column-count: 4;
    column-gap: 14px;
  }
  @media (max-width: 1100px) { .gallery { column-count: 3; } }
  @media (max-width: 720px)  { .gallery { column-count: 2; } }
  @media (max-width: 600px)  { .gallery { padding: 40px 12px 60px; } }

  .gallery-item {
    display: block;
    width: 100%;
    margin: 0 0 14px;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    break-inside: avoid;
    background: var(--black-soft);
  }
  .gallery-item img {
    display: block;
    width: 100%;
    height: auto;
  }
  .gallery-item:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: 0 8px 28px rgba(212,160,23,0.25);
  }

  /* ── LIGHTBOX MODAL ── */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(5,5,5,0.92);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 1000;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 8px;
    border: 3px solid var(--gold);
    box-shadow: 0 0 60px rgba(0,0,0,0.7);
    user-select: none;
  }
  .lb-btn {
    position: absolute;
    background: rgba(20,20,20,0.7);
    border: 2px solid rgba(212,160,23,0.5);
    color: var(--gold-light);
    width: 52px; height: 52px;
    border-radius: 50%;
    font-size: 1.6rem; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .lb-btn:hover { background: rgba(212,160,23,0.25); border-color: var(--gold); transform: scale(1.08); }
  .lb-prev { left: 18px; top: 50%; transform: translateY(-50%); }
  .lb-prev:hover { transform: translateY(-50%) scale(1.08); }
  .lb-next { right: 18px; top: 50%; transform: translateY(-50%); }
  .lb-next:hover { transform: translateY(-50%) scale(1.08); }
  .lb-close { top: 18px; right: 18px; font-size: 1.4rem; }
  .lb-counter {
    position: absolute;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Bangers', cursive;
    letter-spacing: 2px;
    color: var(--gold-light);
    background: rgba(20,20,20,0.7);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 1rem;
  }
  @media (max-width: 600px) {
    .lb-btn { width: 42px; height: 42px; font-size: 1.3rem; }
    .lb-prev { left: 8px; } .lb-next { right: 8px; } .lb-close { right: 8px; top: 8px; }
  }
</style>

  ];
  const FULL  = f => "gallery/" + f;
  const THUMB = f => "gallery/thumbs/" + f;

  // ── Build masonry (thumbnails) ──
  const galleryEl = document.getElementById('gallery');
  const frag = document.createDocumentFragment();
  const EAGER = 8; // first row: load immediately at high priority for fast first paint
  PHOTOS.forEach((p, i) => {
    const fig = document.createElement('div');
    fig.className = 'gallery-item';
    fig.dataset.index = i;
    const img = document.createElement('img');
    img.src = THUMB(p.f);
    img.width = p.w;            // intrinsic size -> browser reserves space (no layout shift)
    img.height = p.h;
    img.alt = 'Zachary — photo ' + (i + 1);
    img.decoding = 'async';
    if (i < EAGER) { img.loading = 'eager'; img.setAttribute('fetchpriority', 'high'); }
    else { img.loading = 'lazy'; }
    fig.appendChild(img);
    frag.appendChild(fig);
  });
  galleryEl.appendChild(frag);

  // ── Lightbox (full-res) ──
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbCounter = document.getElementById('lbCounter');
  let current = 0;

  // Prefetch a full-res image so neighbour navigation is instant.
  const _pre = {};
  function preload(i) {
    const idx = (i + PHOTOS.length) % PHOTOS.length;
    if (_pre[idx]) return;
    const im = new Image();
    im.src = FULL(PHOTOS[idx].f);
    _pre[idx] = im;
  }

  function show(i) {
    current = (i + PHOTOS.length) % PHOTOS.length;
    lbImg.src = FULL(PHOTOS[current].f);
    lbImg.alt = 'Zachary — photo ' + (current + 1);
    lbCounter.textContent = (current + 1) + ' / ' + PHOTOS.length;
    preload(current + 1);
    preload(current - 1);
  }
  function openLightbox(i) {
    show(i);
    lightbox.classList.add('open');
    lightbox.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  galleryEl.addEventListener('click', (e) => {
    const item = e.target.closest('.gallery-item');
    if (item) openLightbox(Number(item.dataset.index));
  });
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', (e) => { e.stopPropagation(); show(current - 1); });
  document.getElementById('lbNext').addEventListener('click', (e) => { e.stopPropagation(); show(current + 1); });
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') show(current - 1);
    else if (e.key === 'ArrowRight') show(current + 1);
  });
